<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Minecraft Quest Live</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101510;color:#fff;font-family:Arial,sans-serif}main{max-width:950px;margin:auto;padding:20px}.panel{background:#222;border:4px solid #555;padding:22px;box-shadow:8px 8px #000}h1,h2,h3{text-shadow:3px 3px #000}button,input,select{font-size:18px;padding:13px;margin:7px;border:3px solid #111;font-weight:800}button{background:#65ad42;color:#fff;cursor:pointer;box-shadow:4px 4px #000}button:disabled{opacity:.45;cursor:not-allowed}input{width:min(360px,90%)}select{max-width:360px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{padding:18px;background:#292929;border:3px solid #666;margin:10px 0}.creeper{border-color:#55a83b}.diamond{border-color:#52bde8}.ok{color:#8cff72}.wait{color:#ffd966}.danger{color:#ff6767}.big{font-size:48px}.xp{height:14px;background:#111;margin:10px 0}.xp i{display:block;height:100%;background:#62d53f}.center{text-align:center}.choice{display:block;width:100%;text-align:left;background:#4b7f38}.choice.correct{background:#24943d}.choice.wrong{background:#9b3333}.timer{font-size:86px;text-align:center;font-weight:900;text-shadow:5px 5px #000}.timer.warning{color:#ff5555}.delay{font-size:48px;text-align:center;color:#ffd966;font-weight:900}.portal-wrap{text-align:center}.portal-grid{display:grid;grid-template-columns:repeat(4,minmax(55px,80px));grid-template-rows:repeat(5,minmax(55px,80px));gap:4px;justify-content:center;margin:18px auto}.portal-slot{border:3px solid #666;background:#555;min-height:55px;cursor:pointer;touch-action:manipulation}.portal-slot.inner{background:#555;border-color:#777}.portal-slot:hover{filter:brightness(1.25)}.portal-slot.filled{background:radial-gradient(circle at center,#7b2cbf 0 18%,#241333 20% 38%,#050505 42% 100%);border:3px solid #9b59d0;box-shadow:inset 0 0 12px #000,0 0 6px #5b1a8a}.portal-slot.inner.filled{background:radial-gradient(circle at center,#7b2cbf 0 18%,#241333 20% 38%,#050505 42% 100%);border-color:#9b59d0}.obsidian-pool{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:15px auto;max-width:620px}.obsidian{width:78px;height:58px;padding:8px;margin:0;background:radial-gradient(circle at center,#7b2cbf 0 20%,#251334 22% 42%,#050505 45% 100%);border:3px solid #555;box-shadow:inset 0 0 10px #000,4px 4px #000;touch-action:none;user-select:none}.obsidian.used{opacity:.25}.portal-actions{margin:12px auto}.portal-check{font-size:22px;padding:15px 28px;background:#4b9f35}.code-fragment{font-size:34px;letter-spacing:4px;text-align:center;background:#111;border:3px solid #777;padding:15px;margin:15px auto;max-width:430px}.code-input{text-align:center;font-size:28px;letter-spacing:4px;text-transform:uppercase;max-width:430px}.badge{display:inline-block;padding:7px 10px;margin:4px;background:#333;border:2px solid #777}@media(max-width:700px){.grid{grid-template-columns:1fr}main{padding:10px}.panel{padding:14px}.big{font-size:34px}.timer{font-size:72px}}
</style>
</head>
<body><main id="app"></main>
<script>
let ws,code="",role="",game=null,quests=[],timerLoop=null,portalSlots=[],selectedBlock=null;
const app=document.getElementById("app");
function connect(){
 code=document.getElementById("code").value.trim().toUpperCase(); role=document.getElementById("role").value;
 if(!code)return alert("Skriv en spelkod.");
 clearInterval(timerLoop);
 ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host);
 ws.onopen=()=>ws.send(JSON.stringify({type:"join",code,role}));
 ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==="joined"||m.type==="state"){game=m.game;quests=m.quests||quests;render()}};
 ws.onclose=()=>setTimeout(()=>{if(document.getElementById("code"))connect()},1500);
}
function send(type,extra={}){if(ws?.readyState===1)ws.send(JSON.stringify({type,code,role,...extra}))}
function login(){app.innerHTML=`<div class="panel"><h1>⛏️ MINECRAFT QUEST</h1><p>Välj roll och ange spelkoden.</p><input id="code" placeholder="t.ex. DRAGON" maxlength="12"><br><select id="role"><option value="gm">🧙 Game Master – S23+</option><option value="creeper">🟩 Team Creeper – iPad</option><option value="diamond">💎 Team Diamond – Galaxy Tab</option></select><br><button onclick="connect()">STARTA SPEL</button></div>`}
function render(){if(!game)return;if(role==="gm")renderGM();else renderTeam()}
function questText(i){return [
"Hitta 2 trä och 2 sten. När alla resurser är hittade, tryck KLAR.",
"Besegra 5 zombies genom att pricka målen med snöbollar. Inga kast på personer.",
"Varje spelare ska hitta sin egen Diamond. 4 spelare = 4 Diamonds.",
"Vad behövs för att crafta ett Diamond Sword? Välj rätt alternativ.",
"Creepern kommer! Ta er till Safe Room när nedräkningen startar.",
"Bygg ett torn med exakt 6 träbitar. Minst 20 cm högt och stå själv i minst 10 sekunder.",
"Ta er genom Spider Web utan att röra nätet.",
"Aktivera Nether Portal genom att placera Obsidian Blocks på rätt platser.",
"Varje lag har fått en kodbit. Prata med det andra laget och slå ihop kodbitarna till en gemensam kod.",
"Ni har klarat allt! Diamond Chest är upplåst."
][i]}
function renderTeam(){
 const t=game.teams[role],q=quests[t.q];
 let body="";
 if(t.q===3) body=choiceBody();
 else if(t.q===4) body=timerBody(t);
 else if(t.q===7) body=portalBody();
 else if(t.q===8) body=teamworkBody(t);
 const status=t.approved?'<h2 class="ok">✓ Quest godkänd!</h2><p>Vänta på nästa quest.</p>':t.done?'<h2 class="wait">✓ KLAR!</h2><p>Vänta på Game Master.</p>':'';
 const manual=t.q!==3&&t.q!==4&&t.q!==7&&t.q!==8&&!t.done;
 app.innerHTML=`<div class="panel"><h1>${role==="creeper"?"🟩":"💎"} ${role==="creeper"?"TEAM CREEPER":"TEAM DIAMOND"}</h1><p><b>Quest ${t.q+1}/10</b></p><h2>${q.icon} ${q.title}</h2><p>${questText(t.q)}</p><div class="xp"><i style="width:${(t.q+1)*10}%"></i></div>${body}${status}${manual?'<button onclick="send(\'team_done\')">✓ KLAR</button>':''}</div>`;
 if(t.q===4)startTimer(t);
 if(t.q===8)setTimeout(()=>focusCode(),50);
}
function choiceBody(){return `<div class="card"><h3>⚔️ Crafting</h3><button class="choice" onclick="answer(0,this)">A) 3 Diamond + 1 Stick</button><button class="choice" onclick="answer(1,this)">B) 2 Diamond + 2 Stick</button><button class="choice" onclick="answer(2,this)">C) 4 Diamond + 1 Stick</button><p id="choiceMsg"></p></div>`}
function answer(i,btn){if(game.teams[role].done)return;const all=[...document.querySelectorAll('.choice')];if(i===0){btn.classList.add('correct');document.getElementById('choiceMsg').innerHTML='<span class="ok">✓ Diamond Sword craftad! +XP</span>';send('auto_done')}else{btn.classList.add('wrong');document.getElementById('choiceMsg').innerHTML='<span class="danger">❌ Inte rätt. Försök igen!</span>';setTimeout(()=>btn.classList.remove('wrong'),500)}}
function startTimer(t){clearInterval(timerLoop);if(!t.timerStart){return}timerLoop=setInterval(()=>{const now=Date.now();const diff=t.timerStart-now;if(diff>0){const s=Math.ceil(diff/1000);const el=document.getElementById('countdown');if(el)el.innerHTML=`<div class="delay">💥 CREEPER INCOMING...<br><span>${s}</span></div>`;return}const left=Math.max(0,30000-(now-t.timerStart));const el=document.getElementById('countdown');if(el)el.innerHTML=`<div class="timer ${left<=10000?'warning':''}">${Math.ceil(left/1000)}</div><p class="center">🏃 Till Safe Room!</p>`;if(left<=0){clearInterval(timerLoop);if(!game.teams[role].done)send('timer_done') }},100);}
function timerBody(t){return `<div id="countdown" class="card"><div class="delay">💥 CREEPER INCOMING...</div></div>`}
const frame=[1,2,4,7,8,11,12,15,17,18];
const correct=frame;
function portalBody(){if(portalSlots.length!==10)portalSlots=Array(10).fill(null);return `<div class="portal-wrap"><p>🔥 Bygg ramen som i Minecraft.</p><div class="portal-grid">${Array.from({length:20},(_,i)=>{const idx=frame.indexOf(i);const inner=[5,6,9,10,13,14].includes(i);const filled=placedCells[i]!==null;const innerFilled=inner&&placedCells[i]!==null;return `<div class="portal-slot ${inner?'inner':''} ${filled||innerFilled?'filled':''}" data-cell="${i}" onclick="dropBlock(event,${i})"></div>`}).join('')}</div><div class="obsidian-pool">${Array.from({length:10},(_,i)=>`<button class="obsidian ${portalSlots.includes(i)?'used':''}" id="obs${i}" onclick="pickBlock(event,${i})">Obsidian</button>`).join('')}</div><div class="portal-actions"><button class="portal-check" onclick="checkPortal()">✓ KLAR – KONTROLLERA PORTALEN</button></div><p id="portalMsg" class="muted">Välj en Obsidian Block och tryck sedan på valfri ruta.</p></div>`}
function pickBlock(e,i){e.preventDefault();if(portalSlots.includes(i))return;selectedBlock=i;document.querySelectorAll('.obsidian').forEach((b,n)=>b.style.outline=n===i?'4px solid #fff':'none');const m=document.getElementById('portalMsg');if(m)m.textContent='Vald Obsidian: tryck på valfri ruta i portalen.'}
let placedCells=Array(20).fill(null);
function dropBlock(e,cell){e.preventDefault();const msg=document.getElementById('portalMsg');if(selectedBlock===null){if(placedCells[cell]!==null){const old=placedCells[cell];placedCells[cell]=null;renderPortalOnly();const m=document.getElementById('portalMsg');if(m)m.textContent='Obsidian tillbaka i lagret.'}return}if(placedCells[cell]!==null){if(msg)msg.innerHTML='<span class="danger">❌ Rutan är redan upptagen. Tryck på den för att ta bort blocket.</span>';return}if(placedCells.filter(v=>v!==null).length>=10){if(msg)msg.innerHTML='<span class="danger">❌ Alla 10 Obsidian Blocks används.</span>';return}placedCells[cell]=selectedBlock;selectedBlock=null;clearSelection();renderPortalOnly()}
function checkPortal(){const msg=document.getElementById('portalMsg');const placed=placedCells.map((v,i)=>v!==null?i:null).filter(v=>v!==null);const right=placed.length===10&&placed.every(v=>frame.includes(v));if(!right){if(msg)msg.innerHTML='<span class="danger">❌ Inte rätt ännu! Kontrollera ramen och försök igen.</span>';return}if(msg)msg.innerHTML='<span class="ok">🔥 NETHER PORTAL ACTIVATED!</span>';send('portal_done')}
function clearSelection(){document.querySelectorAll('.obsidian').forEach(b=>b.style.outline='none')}
function renderPortalOnly(){const t=game.teams[role];if(t.q!==7||t.done)return;const wrap=document.querySelector('.portal-wrap');if(!wrap)return;wrap.outerHTML=portalBody();}
function teamworkBody(t){const frag=t.codeFragment||'';return `<div class="card"><h3>🤝 Teamwork</h3><p>Er kodbit är:</p><div class="code-fragment">${frag}</div><p>Prata med det andra laget. Slå ihop era kodbitar och skriv in den gemensamma koden.</p><input id="finalCode" class="code-input" maxlength="20" placeholder="GEMENSAM KOD"><br><button onclick="checkFinalCode()">🔐 LÅS UPP</button><p id="codeMsg"></p></div>`}
function checkFinalCode(){const v=document.getElementById('finalCode').value.trim().toUpperCase();if(v===game.sharedCode){document.getElementById('codeMsg').innerHTML='<span class="ok">✓ Rätt kod! Båda lagen har klarat Teamwork Quest.</span>';send('teamwork_done')}else document.getElementById('codeMsg').innerHTML='<span class="danger">❌ Fel kod. Prata med det andra laget.</span>'}
function focusCode(){const x=document.getElementById('finalCode');if(x)x.focus()}
function renderGM(){const c=game.teams.creeper,d=game.teams.diamond;app.innerHTML=`<div class="panel"><h1>🧙 GAME MASTER</h1><p>Spelkod: <b>${code}</b></p><div class="grid">${teamCard('creeper','🟩 Team Creeper',c)}${teamCard('diamond','💎 Team Diamond',d)}</div><div class="card"><h2>🔓 Nästa quest</h2><p>${c.approved&&d.approved?'Båda lagen är godkända!':'Båda lagen måste vara klara och godkända.'}</p><button ${c.approved&&d.approved?'':'disabled'} onclick="send('unlock_both')">🔓 LÅS UPP NÄSTA QUEST FÖR BÅDA</button><button onclick="send('reset')">↻ STARTA OM SPELET</button></div></div>`}
function teamCard(key,name,t){const q=quests[t.q];return `<div class="card ${key}"><h2>${name}</h2><h3>Quest ${t.q+1}: ${q.icon} ${q.title}</h3><p>${t.approved?'<span class="ok">✓ GODKÄND</span>':t.done?'<span class="wait">✓ KLAR – redo</span>':'⏳ Pågår'}</p><button ${t.done&&!t.approved?'':'disabled'} onclick="send('approve',{team:'${key}'})">✅ GODKÄNN</button></div>`}
login();
</script>
</body></html>
