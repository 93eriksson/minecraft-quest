<style>
*{box-sizing:border-box}body{margin:0;background:#101510;color:#fff;font-family:Arial,sans-serif;font-size:18px}main{max-width:950px;margin:auto;padding:20px}.panel{background:#222;border:4px solid #555;padding:22px;box-shadow:8px 8px #000}h1,h2,h3{text-shadow:3px 3px #000}h1{font-size:clamp(30px,5vw,50px)}h2{font-size:clamp(25px,4.2vw,36px)}h3{font-size:clamp(22px,3.5vw,30px)}p{font-size:1em;line-height:1.35}button,input,select{font-size:19px;padding:13px;margin:7px;border:3px solid #111;font-weight:800}button{background:#65ad42;color:#fff;cursor:pointer;box-shadow:4px 4px #000}button:disabled{opacity:.45;cursor:not-allowed}input{width:min(360px,90%)}select{max-width:360px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{padding:18px;background:#292929;border:3px solid #666;margin:10px 0}.creeper{border-color:#55a83b}.diamond{border-color:#52bde8}.ok{color:#8cff72}.wait{color:#ffd966}.danger{color:#ff6767}.big{font-size:48px}.xp{height:14px;background:#111;margin:10px 0}.xp i{display:block;height:100%;background:#62d53f}.center{text-align:center}.choice{display:block;font-size:20px;min-height:58px;width:100%;text-align:left;background:#4b7f38}.choice.correct{background:#24943d}.choice.wrong{background:#9b3333}.timer{font-size:86px;text-align:center;font-weight:900;text-shadow:5px 5px #000}.timer.warning{color:#ff5555}.delay{font-size:48px;text-align:center;color:#ffd966;font-weight:900}.portal-wrap{text-align:center}.portal-grid{display:grid;grid-template-columns:repeat(4,minmax(55px,80px));grid-template-rows:repeat(5,minmax(55px,80px));gap:4px;justify-content:center;margin:18px auto}.portal-slot{border:4px solid #777;background:#666;min-height:55px;cursor:pointer;touch-action:manipulation;box-shadow:inset 3px 3px rgba(255,255,255,.10),inset -4px -4px rgba(0,0,0,.28);position:relative;image-rendering:pixelated}.portal-slot:before{content:'';position:absolute;inset:5px;background:linear-gradient(135deg,rgba(255,255,255,.07) 0 12%,transparent 12% 25%,rgba(0,0,0,.08) 25% 38%,transparent 38% 55%,rgba(255,255,255,.05) 55% 70%,transparent 70%);opacity:.9;pointer-events:none}.portal-slot.inner{background:#666;border-color:#777}.portal-slot:hover{filter:brightness(1.25)}.portal-slot.filled{background:linear-gradient(135deg,#050505 0 18%,#171017 18% 38%,#030303 38% 62%,#161016 62% 82%,#050505 82%);border:4px solid #111;box-shadow:inset 4px 4px rgba(255,255,255,.04),inset -5px -5px rgba(0,0,0,.55),0 0 5px #000}.portal-slot.inner.filled{background:radial-gradient(circle at 50% 50%,#c56bff 0 12%,#7b2cbf 13% 27%,#24102f 28% 48%,#09040d 49% 100%);border-color:#8f49b8;box-shadow:inset 0 0 18px #000,0 0 10px #7b2cbf}.obsidian-pool{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:15px auto;max-width:620px}.obsidian{width:96px;height:64px;padding:8px;margin:0;background:linear-gradient(135deg,#101010 0 20%,#252525 20% 28%,#080808 28% 48%,#1e1e1e 48% 64%,#050505 64%);border:4px solid #333;box-shadow:inset 0 0 10px #000,4px 4px #000;touch-action:none;user-select:none}.obsidian.used{opacity:.25}.portal-actions{margin:12px auto}.portal-check{font-size:25px;padding:15px 28px;background:#4b9f35}.code-fragment{font-size:34px;letter-spacing:4px;text-align:center;background:#111;border:3px solid #777;padding:15px;margin:15px auto;max-width:430px}.code-input{text-align:center;font-size:28px;letter-spacing:4px;text-transform:uppercase;max-width:430px}
.fx-pop{animation:fxPop .45s ease}.fx-shake{animation:fxShake .42s ease}.fx-pulse{animation:fxPulse 1s ease infinite}.portal-active{animation:portalActive 1.2s ease-in-out infinite}.flash-good{animation:flashGood .65s ease}.flash-bad{animation:flashBad .45s ease}.zombie-alert{font-size:64px;text-align:center;animation:zombieIn .8s ease}.explosion-overlay{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#fff 0%,#ffd54a 14%,#ff7a00 35%,#d71900 58%,rgba(0,0,0,.92) 100%);animation:boom 2.6s ease forwards;pointer-events:none}.explosion-core{font-size:clamp(100px,24vw,260px);font-weight:900;text-shadow:0 0 25px #fff,8px 8px 0 #7a1600;animation:boomText 2.6s ease forwards}.fuse{font-size:42px;color:#ffd966;text-align:center;font-weight:900;animation:fusePulse .7s infinite}.zombie-wave{animation:zombieWave 1.2s ease infinite}@keyframes zombieIn{0%{transform:scale(.2) translateY(40px);opacity:0}60%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}@keyframes zombieWave{0%,100%{transform:translateX(0) rotate(0)}25%{transform:translateX(-8px) rotate(-3deg)}75%{transform:translateX(8px) rotate(3deg)}}@keyframes fusePulse{0%,100%{text-shadow:0 0 4px #ff9d00}50%{text-shadow:0 0 22px #ff4d00}}@keyframes boom{0%{opacity:0;transform:scale(.15)}8%{opacity:1;transform:scale(1.08)}20%{transform:scale(1)}78%{opacity:1}100%{opacity:0;transform:scale(1.12)}}@keyframes boomText{0%{transform:scale(.1) rotate(-18deg);opacity:0}10%{transform:scale(1.2) rotate(8deg);opacity:1}25%{transform:scale(1) rotate(-3deg)}75%{transform:scale(1.05)}100%{transform:scale(1.35);opacity:0}}@keyframes fxPop{0%{transform:scale(.75);opacity:.3}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}@keyframes fxShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(5px)}}@keyframes fxPulse{0%,100%{box-shadow:0 0 0 #7b2cbf}50%{box-shadow:0 0 24px #7b2cbf}}@keyframes portalActive{0%,100%{filter:brightness(1)}50%{filter:brightness(1.8) saturate(1.3)}}@keyframes flashGood{0%{filter:brightness(1)}40%{filter:brightness(1.9)}100%{filter:brightness(1)}}@keyframes flashBad{0%,100%{filter:brightness(1)}50%{filter:brightness(.55)}}@keyframes buttonPop{0%{transform:scale(1)}50%{transform:scale(.94)}100%{transform:scale(1)}}@keyframes xpRise{0%{transform:translateY(10px) scale(.7);opacity:0}30%{opacity:1}100%{transform:translateY(-34px) scale(1.15);opacity:0}}@keyframes screenGood{0%,100%{filter:brightness(1)}30%{filter:brightness(1.8)}60%{filter:brightness(1.15)}}@keyframes screenBad{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-5px)}}@keyframes portalInner{0%,100%{filter:brightness(.85)}50%{filter:brightness(1.7)}}@keyframes unlockFade{0%{opacity:0}15%{opacity:1}70%{opacity:1}100%{opacity:0}}@keyframes unlockPop{0%{transform:scale(.2);opacity:0}30%{transform:scale(1.15);opacity:1}55%{transform:scale(1)}100%{transform:scale(1.08);opacity:0}}
.button-pop{animation:buttonPop .18s ease}.xp-pop{position:relative;display:inline-block;animation:xpRise 1s ease forwards}.screen-good{animation:screenGood .7s ease}.screen-bad{animation:screenBad .45s ease}.unlock-overlay{position:fixed;inset:0;z-index:9998;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,rgba(124,255,100,.8),rgba(25,80,20,.94));animation:unlockFade 2s ease forwards;pointer-events:none}.unlock-card{font-size:clamp(42px,9vw,100px);font-weight:900;text-align:center;text-shadow:5px 5px #000;animation:unlockPop 1s ease}.portal-slot.inner{background:#16101d;border-color:#777}.portal-slot.inner.filled{background:radial-gradient(circle at center,#b05cff 0 14%,#52206e 16% 36%,#160c1d 40% 100%);border-color:#9b59d0;box-shadow:inset 0 0 18px #000,0 0 12px #7b2cbf}.portal-grid.portal-active .portal-slot.filled{animation:portalActive .75s ease-in-out infinite}.portal-grid.portal-active .portal-slot.inner{animation:portalInner .6s ease-in-out infinite}.badge{display:inline-block;padding:7px 10px;margin:4px;background:#333;border:2px solid #777}.portal-slot:hover{transform:scale(1.02);filter:brightness(1.12)}.portal-slot.filled:after{content:'';position:absolute;inset:7px;background:repeating-linear-gradient(90deg,transparent 0 10px,rgba(255,255,255,.025) 10px 14px);pointer-events:none}.minecraft-text{letter-spacing:.4px}.fuse-fire{display:inline-block;font-size:1.1em;filter:drop-shadow(0 0 8px #ff6500);animation:fuseFire .22s steps(2,end) infinite}.explosion-overlay{background:radial-gradient(circle at 50% 48%,#fff 0%,#fff7b0 5%,#ffd23f 13%,#ff8a00 25%,#e83a00 43%,#5d0900 66%,rgba(0,0,0,.96) 100%);overflow:hidden}.explosion-overlay:before,.explosion-overlay:after{content:'';position:absolute;inset:-20%;background:conic-gradient(from 0deg,transparent 0 8deg,#fff5b0 8deg 12deg,transparent 12deg 24deg,#ff8a00 24deg 30deg,transparent 30deg 45deg);mix-blend-mode:screen;animation:blastRays .35s steps(2,end) infinite;opacity:.8}.explosion-overlay:after{animation-direction:reverse;animation-duration:.5s;opacity:.55}.explosion-core{position:relative;z-index:2}.zombie-alert{font-size:clamp(60px,12vw,120px);text-shadow:6px 6px #000,0 0 20px #7cff72}.zombie-alert:after{content:'🧟 🧟 🧟';display:block;font-size:.45em;margin-top:-10px;animation:zombieWave .5s ease infinite}.timer.warning{animation:dangerPulse .55s steps(2,end) infinite}.fuse{background:#111;border:3px solid #6b4a18;padding:8px 16px;display:inline-block;box-shadow:inset 0 0 14px #000}.fuse .spark{display:inline-block;animation:fuseFire .18s steps(2,end) infinite}@keyframes fuseFire{0%,100%{transform:scale(1) rotate(-3deg);text-shadow:0 0 5px #ff9d00,0 0 12px #ff4500}50%{transform:scale(1.18) rotate(4deg);text-shadow:0 0 12px #fff,0 0 25px #ff4500}}@keyframes blastRays{from{transform:rotate(0deg) scale(1)}to{transform:rotate(25deg) scale(1.12)}}@keyframes dangerPulse{0%,100%{transform:scale(1);filter:brightness(1)}50%{transform:scale(1.08);filter:brightness(1.8)}}.final-quest{position:relative;overflow:hidden;text-align:center;padding:24px;background:linear-gradient(#202020,#101010);border:4px solid #777;box-shadow:inset 0 0 30px rgba(124,255,100,.12),8px 8px #000}.final-chest{font-size:clamp(90px,20vw,180px);display:inline-block;animation:chestBounce 1.2s ease-in-out infinite;filter:drop-shadow(0 0 18px #ffd34d)}.final-title{font-size:clamp(34px,7vw,72px);color:#ffd34d;text-shadow:5px 5px #000,0 0 18px #fff2a0;animation:finalTitle 1.2s ease-in-out infinite}.final-sub{font-size:clamp(22px,4vw,34px);color:#8cff72;font-weight:900}.final-particle{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 20% 30%,#fff 0 2px,transparent 3px),radial-gradient(circle at 80% 20%,#ffd34d 0 3px,transparent 4px),radial-gradient(circle at 30% 75%,#8cff72 0 2px,transparent 3px),radial-gradient(circle at 75% 70%,#7bdcff 0 2px,transparent 3px);animation:particles 2s linear infinite}.final-overlay{position:fixed;inset:0;z-index:10000;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#fff9c4 0%,rgba(255,211,70,.9) 18%,rgba(45,90,30,.96) 58%,rgba(0,0,0,.98) 100%);animation:finalOverlay 3.8s ease forwards;pointer-events:none}.final-overlay-card{text-align:center;font-weight:900;text-shadow:6px 6px #000;animation:finalOverlayCard 3.8s ease forwards}.final-overlay-chest{font-size:clamp(100px,25vw,240px);filter:drop-shadow(0 0 30px #ffd34d)}.final-overlay-title{font-size:clamp(38px,8vw,88px);color:#ffd34d}.final-overlay-sub{font-size:clamp(22px,4vw,40px);color:#8cff72}@keyframes chestBounce{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-12px) scale(1.05)} }@keyframes finalTitle{0%,100%{transform:scale(1)}50%{transform:scale(1.04);filter:brightness(1.3)}}@keyframes particles{0%{transform:scale(1) rotate(0);opacity:.5}50%{transform:scale(1.08) rotate(4deg);opacity:1}100%{transform:scale(1) rotate(8deg);opacity:.5}}@keyframes finalOverlay{0%{opacity:0}8%{opacity:1}78%{opacity:1}100%{opacity:0}}@keyframes finalOverlayCard{0%{transform:scale(.2);opacity:0}12%{transform:scale(1.08);opacity:1}25%{transform:scale(1)}78%{transform:scale(1.04);opacity:1}100%{transform:scale(1.15);opacity:0}}
@media(max-width:700px){.grid{grid-template-columns:1fr}main{padding:10px}.panel{padding:14px}.big{font-size:34px}.timer{font-size:72px}}
</style>
</head>
<body><main id="app"></main>
<script>
let ws,code="",role="",game=null,quests=[],timerLoop=null,portalSlots=[],selectedBlock=null,lastAudioQuest=-1,explosionShown=false;
const app=document.getElementById("app");
const audioCtx=window.AudioContext||window.webkitAudioContext;let ac=null;
function audio(){if(!ac&&audioCtx)ac=new audioCtx();if(ac&&ac.state==='suspended')ac.resume();return ac}
function tone(freq,dur,type='square',vol=.045,delay=0){const c=audio();if(!c)return;const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(.0001,c.currentTime+delay);g.gain.exponentialRampToValueAtTime(vol,c.currentTime+delay+.015);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+delay+dur);o.connect(g).connect(c.destination);o.start(c.currentTime+delay);o.stop(c.currentTime+delay+dur+.03)}
function noise(dur=.35,vol=.035){const c=audio();if(!c)return;const b=c.createBuffer(1,c.sampleRate*dur,c.sampleRate),data=b.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*Math.pow(1-i/data.length,1.8);const src=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();f.type='lowpass';f.frequency.value=1800;g.gain.value=vol;src.buffer=b;src.connect(f).connect(g).connect(c.destination);src.start()}
function sfx(name){
 if(name==='click')tone(220,.045,'square',.025);
 if(name==='good'){tone(523,.12,'square',.05);tone(659,.12,'square',.05,.1);tone(784,.2,'square',.055,.2)}
 if(name==='bad'){tone(150,.16,'sawtooth',.05);tone(110,.18,'sawtooth',.04,.12)}
 if(name==='portal'){tone(196,.18,'sine',.05);tone(294,.18,'sine',.05,.12);tone(392,.3,'sine',.06,.24);noise(.8,.025)}
 if(name==='zombie'){
   const c=audio();
   if(c){
     const o=c.createOscillator(),g=c.createGain(),f=c.createBiquadFilter();
     o.type='sawtooth'; o.frequency.setValueAtTime(190,c.currentTime); o.frequency.exponentialRampToValueAtTime(72,c.currentTime+.72);
     f.type='lowpass'; f.frequency.value=900; g.gain.setValueAtTime(.0001,c.currentTime);
     g.gain.exponentialRampToValueAtTime(.065,c.currentTime+.05); g.gain.setValueAtTime(.045,c.currentTime+.34); g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.8);
     o.connect(f).connect(g).connect(c.destination); o.start(); o.stop(c.currentTime+.84);
   }
   noise(.42,.028); tone(110,.22,'triangle',.035,.18); tone(82,.35,'sawtooth',.028,.4);
 }
 if(name==='fuse'){
   noise(.22,.045); tone(1150,.035,'square',.028); tone(1450,.035,'square',.024,.055); tone(1750,.03,'square',.022,.11); tone(950,.025,'square',.018,.16);
 }
 if(name==='explosion'){
   noise(1.35,.12); tone(95,.75,'sawtooth',.09); tone(55,.95,'sine',.08,.08); tone(180,.3,'sawtooth',.05,.02);
   setTimeout(()=>noise(.8,.07),220); setTimeout(()=>tone(45,.7,'sine',.06),300);
 }
 if(name==='tick')tone(900,.035,'square',.018);
 if(name==='fuseTick'){noise(.045,.022);tone(1050,.045,'square',.02);tone(1350,.035,'square',.018,.045)}
 if(name==='portalWhoosh'){noise(.65,.03);tone(196,.25,'sine',.045);tone(294,.25,'sine',.045,.15);tone(440,.35,'sine',.05,.3)}
 if(name==='unlock'){tone(392,.1,'square',.04);tone(523,.1,'square',.04,.09);tone(784,.25,'square',.05,.18)}
 if(name==='victory'){tone(523,.16,'square',.055);tone(659,.16,'square',.055,.14);tone(784,.18,'square',.06,.28);tone(1047,.35,'square',.065,.44);tone(784,.18,'square',.045,.8);tone(1047,.45,'sine',.06,1.0);noise(.9,.025)}
}
function animateMsg(id,cls){const e=document.getElementById(id);if(!e)return;e.classList.remove(cls);void e.offsetWidth;e.classList.add(cls)}

function connect(){
 code=document.getElementById("code").value.trim().toUpperCase(); role=document.getElementById("role").value;
 if(!code)return alert("Skriv en spelkod.");
 clearInterval(timerLoop);
 ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host);
 ws.onopen=()=>ws.send(JSON.stringify({type:"join",code,role}));
 ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==="joined"||m.type==="state"){game=m.game;quests=m.quests||quests;render()}};
 ws.onclose=()=>setTimeout(()=>{if(document.getElementById("code"))connect()},1500);
}
function send(type,extra={}){if(ws?.readyState===1)ws.send(JSON.stringify({type,code,role,...extra}))}
function login(){app.innerHTML=`<div class="panel"><h1>⛏️ MINECRAFT QUEST</h1><p>Välj roll och ange spelkoden.</p><input id="code" placeholder="t.ex. DRAGON" maxlength="12"><br><select id="role"><option value="gm">🧙 Game Master – S23+</option><option value="creeper">🟩 Team Creeper – iPad</option><option value="diamond">💎 Team Diamond – Galaxy Tab</option></select><br><button onclick="connect()">STARTA SPEL</button></div>`}
function render(){if(!game)return;if(role==="gm")renderGM();else renderTeam()}
function questText(i){return [
"Hitta 2 trä och 2 sten. När alla resurser är hittade, tryck KLAR.",
"Besegra 5 zombies genom att pricka målen med snöbollar. Inga kast på personer.",
"Varje spelare ska hitta sin egen Diamond. 4 spelare = 4 Diamonds.",
"Bygg ett crafting table av 4 klossar i en 2×2-kvadrat. Visa bygget för Game Master och tryck KLAR.",
"Vad behövs för att crafta ett Diamond Sword? Välj rätt alternativ.",
"Creepern kommer! Ta er till Safe Room när nedräkningen startar.",
"Bygg ett torn med exakt 6 träbitar. Minst 20 cm högt och stå själv i minst 10 sekunder.",
"Ta er genom Spider Web utan att röra nätet.",
"Aktivera Nether Portal genom att placera Obsidian Blocks på rätt platser.",
"Varje lag har fått en kodbit. Prata med det andra laget och slå ihop kodbitarna till en gemensam kod.",
"Ni har klarat allt! Diamond Chest är upplåst."
][i]}
function renderTeam(){
 const t=game.teams[role],q=quests[t.q];
 let body="";
 if(t.q===1) body=zombieBody();
 else if(t.q===4) body=choiceBody();
 else if(t.q===5) body=timerBody(t);
 else if(t.q===8) body=portalBody();
 else if(t.q===9) body=teamworkBody(t);
 else if(t.q===10) body=finalBody();
 const status=t.approved?'<h2 class="ok">✓ Quest godkänd!</h2><p>Vänta på nästa quest.</p>':t.done?'<h2 class="wait">✓ KLAR!</h2><p>Vänta på Game Master.</p>':'';
 const manual=t.q!==4&&t.q!==5&&t.q!==8&&t.q!==9&&!t.done;
 app.innerHTML=`<div class="panel"><h1>${role==="creeper"?"🟩":"💎"} ${role==="creeper"?"TEAM CREEPER":"TEAM DIAMOND"}</h1><p><b>Quest ${t.q+1}/${quests.length}</b></p><h2>${q.icon} ${q.title}</h2><p>${questText(t.q)}</p><div class="xp"><i style="width:${((t.q+1)/quests.length)*100}%"></i></div>${body}${status}${manual?'<button onclick="send(\'team_done\')">✓ KLAR</button>':''}</div>`;
 if(t.q===1 && lastAudioQuest!==t.q){lastAudioQuest=t.q;setTimeout(()=>sfx('zombie'),80);setTimeout(()=>sfx('zombie'),1050)}
 if(t.q===5)startTimer(t);
 if(t.q===9)setTimeout(()=>focusCode(),50);
 if(t.q===10 && lastAudioQuest!==t.q){lastAudioQuest=t.q;setTimeout(()=>{sfx('victory');showFinalCelebration()},120)}
}
function zombieBody(){return `<div class="card center"><div class="zombie-alert zombie-wave">🧟 🧟 🧟</div><h2 class="danger">ZOMBIES ATTACK!</h2><p>De kommer! Ta era snöbollar och besegra 5 zombies genom att pricka målen.</p><p class="wait">🔊 Lyssna efter zombie-ljudet!</p></div>`}
function choiceBody(){return `<div class="card"><h3>⚔️ Crafting</h3><button class="choice" onclick="answer(0,this)">A) 3 Diamond + 1 Stick</button><button class="choice" onclick="answer(1,this)">B) 2 Diamond + 2 Stick</button><button class="choice" onclick="answer(2,this)">C) 4 Diamond + 1 Stick</button><p id="choiceMsg"></p></div>`}
function answer(i,btn){if(game.teams[role].done)return;if(i===0){btn.classList.add('correct','fx-pop');document.getElementById('choiceMsg').innerHTML='<span class="ok fx-pop">✓ Diamond Sword craftad! <span class="xp-pop">+XP ⚔️</span></span>';sfx('good');document.querySelector('.panel')?.classList.add('screen-good');setTimeout(()=>document.querySelector('.panel')?.classList.remove('screen-good'),700);setTimeout(()=>send('auto_done'),450)}else{btn.classList.add('wrong','fx-shake');document.getElementById('choiceMsg').innerHTML='<span class="danger fx-shake">❌ Inte rätt. Försök igen!</span>';sfx('bad');document.querySelector('.panel')?.classList.add('screen-bad');setTimeout(()=>document.querySelector('.panel')?.classList.remove('screen-bad'),450);setTimeout(()=>btn.classList.remove('wrong','fx-shake'),500)}}
function startTimer(t){
 clearInterval(timerLoop); if(!t.timerStart)return;
 let started=false,lastTick=-1,finished=false;
 timerLoop=setInterval(()=>{
   const now=Date.now(),diff=t.timerStart-now;
   if(diff>0){
     const sec=Math.ceil(diff/1000),el=document.getElementById('countdown');
     if(el)el.innerHTML=`<div class="fuse">🔥 Tändstubin... ${sec}</div><div class="delay fx-pulse">💥 CREEPER INCOMING...</div>`;
     if(sec!==lastTick){lastTick=sec;sfx('fuse');}
     return;
   }
   if(!started){started=true;sfx('fuse');const el=document.getElementById('countdown');if(el)el.classList.add('fx-shake');}
   const left=Math.max(0,30000-(now-t.timerStart)),el=document.getElementById('countdown');
   if(left>0){if(el)el.innerHTML=`<div class="timer ${left<=10000?'warning':''}">${Math.ceil(left/1000)}</div><p class="center">🏃 Till Safe Room!</p>`;if(Math.ceil(left/1000)!==lastTick){lastTick=Math.ceil(left/1000);sfx(Math.ceil(left/1000)<=10?'fuseTick':'tick');}}
   if(left<=0 && !finished){finished=true;clearInterval(timerLoop);showExplosion();setTimeout(()=>{if(!game.teams[role].done)send('timer_done')},2600);}
 },100);
}
function showExplosion(){
 if(explosionShown)return; explosionShown=true; sfx('explosion');
 const o=document.createElement('div');o.className='explosion-overlay';o.innerHTML='<div class="explosion-core">💥<br><span style="font-size:.42em;letter-spacing:4px">BOOOOM!</span></div>';document.body.appendChild(o);
 setTimeout(()=>{o.remove();explosionShown=false},2650);
}
function timerBody(t){return `<div id="countdown" class="card"><div class="delay">💥 CREEPER INCOMING...</div></div>`}
const frame=[1,2,4,7,8,11,12,15,17,18];
const correct=frame;
function portalBody(){if(portalSlots.length!==10)portalSlots=Array(10).fill(null);return `<div class="portal-wrap"><p>🔥 Bygg ramen som i Minecraft.</p><div class="portal-grid">${Array.from({length:20},(_,i)=>{const idx=frame.indexOf(i);const inner=[5,6,9,10,13,14].includes(i);const filled=placedCells[i]!==null;const innerFilled=inner&&placedCells[i]!==null;return `<div class="portal-slot ${inner?'inner':''} ${filled||innerFilled?'filled':''}" data-cell="${i}" onclick="dropBlock(event,${i})"></div>`}).join('')}</div><div class="obsidian-pool">${Array.from({length:10},(_,i)=>`<button class="obsidian ${portalSlots.includes(i)?'used':''}" id="obs${i}" onclick="pickBlock(event,${i})">⬛ Obsidian</button>`).join('')}</div><div class="portal-actions"><button class="portal-check" onclick="checkPortal()">✓ KLAR – KONTROLLERA PORTALEN</button></div><p id="portalMsg" class="muted">Välj en Obsidian Block och tryck sedan på valfri ruta.</p></div>`}
function pickBlock(e,i){e.preventDefault();if(portalSlots.includes(i))return;selectedBlock=i;document.querySelectorAll('.obsidian').forEach((b,n)=>b.style.outline=n===i?'4px solid #fff':'none');const m=document.getElementById('portalMsg');if(m)m.textContent='Vald Obsidian: tryck på valfri ruta i portalen.'}
let placedCells=Array(20).fill(null);
function dropBlock(e,cell){e.preventDefault();const msg=document.getElementById('portalMsg');if(selectedBlock===null){if(placedCells[cell]!==null){const old=placedCells[cell];placedCells[cell]=null;renderPortalOnly();const m=document.getElementById('portalMsg');if(m)m.textContent='Obsidian tillbaka i lagret.'}return}if(placedCells[cell]!==null){if(msg)msg.innerHTML='<span class="danger">❌ Rutan är redan upptagen. Tryck på den för att ta bort blocket.</span>';return}if(placedCells.filter(v=>v!==null).length>=10){if(msg)msg.innerHTML='<span class="danger">❌ Alla 10 Obsidian Blocks används.</span>';return}placedCells[cell]=selectedBlock;selectedBlock=null;clearSelection();sfx('click');renderPortalOnly()}
function checkPortal(){const msg=document.getElementById('portalMsg');const placed=placedCells.map((v,i)=>v!==null?i:null).filter(v=>v!==null);const right=placed.length===10&&placed.every(v=>frame.includes(v));if(!right){if(msg)msg.innerHTML='<span class="danger fx-shake">❌ Inte rätt ännu! Kontrollera ramen och försök igen.</span>';sfx('bad');animateMsg('portalMsg','flash-bad');return}if(msg)msg.innerHTML='<span class="ok fx-pop">🔥 NETHER PORTAL ACTIVATED!</span>';sfx('portal');sfx('portalWhoosh');const grid=document.querySelector('.portal-grid');if(grid)grid.classList.add('portal-active');document.querySelector('.panel')?.classList.add('screen-good');setTimeout(()=>document.querySelector('.panel')?.classList.remove('screen-good'),1200);setTimeout(()=>send('portal_done'),1100)}
function clearSelection(){document.querySelectorAll('.obsidian').forEach(b=>b.style.outline='none')}
function renderPortalOnly(){const t=game.teams[role];if(t.q!==8||t.done)return;const wrap=document.querySelector('.portal-wrap');if(!wrap)return;wrap.outerHTML=portalBody();}
function finalBody(){return `<div class="final-quest"><div class="final-particle"></div><div class="final-chest">🎁</div><div class="final-title">SKATTJAKTEN KLAR!</div><div class="final-sub">💎 NI HITTADE DIAMONDSKATTEN! 💎</div><p>Alla quests är klara. Ni är riktiga Minecraft-äventyrare!</p></div>`}
function showFinalCelebration(){const o=document.createElement('div');o.className='final-overlay';o.innerHTML='<div class="final-overlay-card"><div class="final-overlay-chest">🎁💎</div><div class="final-overlay-title">SKATTJAKTEN KLAR!</div><div class="final-overlay-sub">✨ QUEST COMPLETE! ✨</div></div>';document.body.appendChild(o);setTimeout(()=>o.remove(),3900)}
function teamworkBody(t){const frag=t.codeFragment||'';return `<div class="card"><h3>🤝 Teamwork</h3><p>Er kodbit är:</p><div class="code-fragment">${frag}</div><p>Prata med det andra laget. Slå ihop era kodbitar och skriv in den gemensamma koden.</p><input id="finalCode" class="code-input" maxlength="20" placeholder="GEMENSAM KOD"><br><button onclick="checkFinalCode()">🔐 LÅS UPP</button><p id="codeMsg"></p></div>`}
function checkFinalCode(){const v=document.getElementById('finalCode').value.trim().toUpperCase();if(v===game.sharedCode){document.getElementById('codeMsg').innerHTML='<span class="ok fx-pop">✓ Rätt kod! Båda lagen har klarat Teamwork Quest.</span>';sfx('unlock');showUnlock();setTimeout(()=>send('teamwork_done'),1400)}else document.getElementById('codeMsg').innerHTML='<span class="danger">❌ Fel kod. Prata med det andra laget.</span>'}
function showUnlock(){const o=document.createElement('div');o.className='unlock-overlay';o.innerHTML='<div class="unlock-card">🤝<br>ENDER DRAGON<br><span style="font-size:.48em">QUEST COMPLETE!</span></div>';document.body.appendChild(o);setTimeout(()=>o.remove(),2050)}
function focusCode(){const x=document.getElementById('finalCode');if(x)x.focus()}
function renderGM(){const c=game.teams.creeper,d=game.teams.diamond;app.innerHTML=`<div class="panel"><h1>🧙 GAME MASTER</h1><p>Spelkod: <b>${code}</b></p><div class="grid">${teamCard('creeper','🟩 Team Creeper',c)}${teamCard('diamond','💎 Team Diamond',d)}</div><div class="card"><h2>🔓 Nästa quest</h2><p>${c.approved&&d.approved?'Båda lagen är godkända!':'Båda lagen måste vara klara och godkända.'}</p><button ${c.approved&&d.approved?'':'disabled'} onclick="send('unlock_both')">🔓 LÅS UPP NÄSTA QUEST FÖR BÅDA</button><button onclick="send('reset')">↻ STARTA OM SPELET</button></div></div>`}
function teamCard(key,name,t){const q=quests[t.q];return `<div class="card ${key}"><h2>${name}</h2><h3>Quest ${t.q+1}: ${q.icon} ${q.title}</h3><p>${t.approved?'<span class="ok">✓ GODKÄND</span>':t.done?'<span class="wait">✓ KLAR – redo</span>':'⏳ Pågår'}</p><button ${t.done&&!t.approved?'':'disabled'} onclick="send('approve',{team:'${key}'})">✅ GODKÄNN</button></div>`}
document.addEventListener('pointerdown',e=>{const b=e.target.closest('button');if(b&&!b.disabled){sfx('click');b.classList.remove('button-pop');void b.offsetWidth;b.classList.add('button-pop')}});
login();
</script>
</body></html>
